; RaStyling System Plugin - Language strings
; en-GB

PLG_SYSTEM_RASTYLING="System - RaStyling"
PLG_SYSTEM_RASTYLING_DESC="Optionally inject ramblers.css, a custom CSS file, and/or a custom JS file into the site front-end."

PLG_SYSTEM_RASTYLING_INCLUDE_RAMBLERS_CSS_LABEL="Include ramblers.css"
PLG_SYSTEM_RASTYLING_INCLUDE_RAMBLERS_CSS_DESC="When enabled, loads /css/ramblers.css from the site root on every front-end page."

PLG_SYSTEM_RASTYLING_CUSTOM_CSS_ENABLED_LABEL="Enable custom CSS file"
PLG_SYSTEM_RASTYLING_CUSTOM_CSS_ENABLED_DESC="When enabled, the path or URL entered below will be injected as a stylesheet on every front-end page."

PLG_SYSTEM_RASTYLING_CUSTOM_CSS_FILE_LABEL="Custom CSS file path / URL"
PLG_SYSTEM_RASTYLING_CUSTOM_CSS_FILE_DESC="Enter a path relative to the site root (e.g. css/my-styles.css) or a full URL (https://…). Only used when 'Enable custom CSS file' is Yes."

PLG_SYSTEM_RASTYLING_CUSTOM_JS_ENABLED_LABEL="Enable custom JS file"
PLG_SYSTEM_RASTYLING_CUSTOM_JS_ENABLED_DESC="When enabled, the path or URL entered below will be injected as a deferred script on every front-end page."

PLG_SYSTEM_RASTYLING_CUSTOM_JS_FILE_LABEL="Custom JS file path / URL"
PLG_SYSTEM_RASTYLING_CUSTOM_JS_FILE_DESC="Enter a path relative to the site root (e.g. js/my-script.js) or a full URL (https://…). Only used when 'Enable custom JS file' is Yes."
